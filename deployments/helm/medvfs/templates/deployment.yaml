{{- if or (eq .Values.mode "standalone") (eq .Values.mode "sidecar") }}
# ─── Deployment Mode (standalone / sidecar) ────────────────────────────────────
# standalone: Single-replica Deployment with FUSE mount for dev/testing.
# sidecar: Generates a Deployment that can be used as a sidecar reference.
#          In production, inject the medvfs container spec into your ML pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medvfs.fullname" . }}
  labels:
    {{- include "medvfs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # FUSE mount requires clean unmount
  selector:
    matchLabels:
      {{- include "medvfs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medvfs.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "medvfs.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.sidecars.enabled }}
      {{- $initContainers := include "medvfs.initContainers" . }}
      {{- if $initContainers }}
      initContainers:
        {{- $initContainers | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        {{- include "medvfs.containerSpec" . | nindent 8 }}
        {{- if .Values.sidecars.enabled }}
        {{- include "medvfs.sidecarContainers" . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "medvfs.volumeSpec" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
